name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow running this workflow manually from the Actions tab
  workflow_dispatch:
  # Rebuild every 3 hours, so content read at build time (the announcement bar from GitHub, and the synced addon
  # catalog pages) stays current. The 18:00 UTC run covers the end of the Thursday community call.
  schedule:
    - cron: '0 */3 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch all history so that Docusaurus can generate proper versioned docs
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Site
        env:
          NODE_ENV: production
          # Increase Node.js heap size to prevent OOM
          NODE_OPTIONS: '--max-old-space-size=4096'
          # The announcement bar reads the latest release from the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn build
          # Verify build output
          ls -la build/


      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Docusaurus v3 outputs to build/ directory by default
          path: 'build/'

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
